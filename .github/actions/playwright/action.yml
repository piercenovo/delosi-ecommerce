name: Playwright browsers
description: Install Chromium for Playwright (browser tests), cached by Playwright version.
runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: echo "version=$(pnpm --filter @delosi/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
    - name: Install Chromium and system dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @delosi/ui exec playwright install --with-deps chromium
    - name: Install system dependencies only
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter @delosi/ui exec playwright install-deps chromium
