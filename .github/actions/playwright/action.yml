name: Playwright browsers
description: Install Playwright browsers and their system dependencies, cached by Playwright version and browser list.
inputs:
  browsers:
    description: Space-separated browsers to install (e.g. "chromium webkit").
    required: false
    default: chromium
runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: echo "version=$(pnpm --filter @delosi/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}
    - name: Install browsers and system dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @delosi/ui exec playwright install --with-deps ${{ inputs.browsers }}
    - name: Install system dependencies only
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter @delosi/ui exec playwright install-deps ${{ inputs.browsers }}
